<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>당구 마스터 - 3구 & 4구 3D 캐롬 당구</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Noto Sans KR', sans-serif; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070b14; color: #f8fafc; }
    #canvas-container { position: fixed; inset: 0; z-index: 1; }
    .glass { background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.18); }
    .btn-primary { background: linear-gradient(135deg, #3b82f6, #6366f1); transition: transform 0.12s ease, box-shadow 0.12s ease; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35); }
    .btn-primary:active { transform: translateY(0); }
    input[type="range"].vertical-slider {
      writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 10px; height: 110px; accent-color: #38bdf8; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- 시작 / 모드 선택 모달 -->
  <div id="start-modal" class="fixed inset-0 z-30 flex items-center justify-center bg-slate-950/85 backdrop-blur-md p-4 overflow-y-auto">
    <div class="glass w-full max-w-2xl rounded-2xl p-6 md:p-8 shadow-2xl my-auto">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-amber-300 to-amber-600 flex items-center justify-center text-slate-950 font-black text-lg shadow">8</div>
        <h1 class="text-2xl md:text-3xl font-black tracking-tight">당구 마스터</h1>
      </div>

      <!-- 1. 경기 종목 -->
      <div class="mb-5">
        <div class="text-sm font-bold text-slate-300 mb-2">1. 경기 종목 선택</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button type="button" data-game="3cushion" class="game-mode-btn text-left p-4 rounded-xl border-2 border-blue-500 bg-blue-950/40 transition">
            <div class="font-bold text-lg text-white mb-1">3구 (쓰리쿠션)</div>
            <div class="text-xs text-slate-300 leading-relaxed">흰공·노란공·빨간공 3개 사용. 2적구 접촉 전 3쿠션 이상 선행 시 +10점.</div>
          </button>
          <button type="button" data-game="4ball" class="game-mode-btn text-left p-4 rounded-xl border border-slate-700 bg-slate-900/60 hover:border-slate-500 transition">
            <div class="font-bold text-lg text-white mb-1">4구 (사구)</div>
            <div class="text-xs text-slate-300 leading-relaxed">빨간공 2개 접촉 +10점, 상대 수구(노란공) 접촉 시 -10점 파울.</div>
          </button>
        </div>
      </div>

      <!-- 2. 플레이 모드 -->
      <div class="mb-5">
        <div class="text-sm font-bold text-slate-300 mb-2">2. 플레이 모드</div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <button type="button" data-play="practice" class="play-mode-btn text-left p-3.5 rounded-xl border-2 border-emerald-500 bg-emerald-950/35 transition">
            <div class="font-bold text-white mb-0.5">🎯 1인 연습</div>
            <div class="text-xs text-slate-300">자유로운 득점 및 기술 연습</div>
          </button>
          <button type="button" data-play="local" class="play-mode-btn text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 hover:border-slate-500 transition">
            <div class="font-bold text-white mb-0.5">⚔️ 2인 로컬</div>
            <div class="text-xs text-slate-300">한 화면에서 1P vs 2P 교대</div>
          </button>
          <button type="button" data-play="online" class="play-mode-btn text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 hover:border-slate-500 transition">
            <div class="font-bold text-white mb-0.5">🌐 온라인 대전</div>
            <div class="text-xs text-slate-300">다른 PC와 방 코드로 연결</div>
          </button>
        </div>
      </div>

      <!-- 온라인 방 패널 -->
      <div id="online-panel" class="hidden mb-5 p-4 rounded-xl bg-slate-900/85 border border-indigo-500/40">
        <div class="flex flex-wrap items-center gap-2 mb-3">
          <button type="button" id="btn-create-room" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-bold text-white">방 만들기 (1P 흰공)</button>
          <div id="room-code-box" class="hidden items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-600">
            <span class="text-xs text-slate-400">방 코드:</span>
            <span id="room-code-display" class="font-mono font-black text-amber-300 tracking-widest text-base"></span>
            <button type="button" id="btn-copy-code" class="text-xs px-2 py-0.5 rounded bg-slate-700 hover:bg-slate-600 text-white">복사</button>
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <input id="join-code-input" type="text" maxlength="6" placeholder="상대 방 코드 입력 (예: A7K9P)" class="px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-sm uppercase tracking-wider text-white w-52 focus:outline-none focus:border-indigo-400" />
          <button type="button" id="btn-join-room" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-sm font-bold text-white">방 참가 (2P 노란공)</button>
        </div>
        <div id="net-status" class="mt-2.5 text-xs text-amber-300">방 만들기를 누르거나 상대 방 코드를 입력해 연결하세요.</div>
      </div>

      <!-- 3. 목표 점수 -->
      <div class="mb-6">
        <label for="target-score-select" class="block text-sm font-bold text-slate-300 mb-2">3. 목표 점수</label>
        <select id="target-score-select" class="w-full sm:w-64 px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-sm font-bold text-white focus:outline-none focus:border-blue-400"></select>
      </div>

      <button type="button" id="btn-start-game" class="btn-primary w-full py-3.5 rounded-xl font-black text-base text-white shadow-lg">경기 시작하기</button>
    </div>
  </div>

  <!-- 상단 HUD -->
  <div id="hud-top" class="hidden fixed top-3 left-3 right-3 z-20 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
    <div class="glass rounded-xl px-4 py-2.5 flex items-center gap-5 pointer-events-auto">
      <div>
        <div class="text-[11px] text-slate-400">1P (흰공)</div>
        <div id="score-p1" class="text-xl font-black text-white">0</div>
      </div>
      <div class="h-7 w-px bg-slate-700"></div>
      <div>
        <div class="text-[11px] text-amber-300">2P (노란공)</div>
        <div id="score-p2" class="text-xl font-black text-amber-300">0</div>
      </div>
      <div class="h-7 w-px bg-slate-700"></div>
      <div>
        <div class="text-[11px] text-slate-400">목표 / 이닝</div>
        <div class="text-sm font-bold text-slate-200"><span id="hud-target">100</span>점 · <span id="hud-inning">1</span>이닝</div>
      </div>
    </div>

    <div id="turn-banner" class="glass rounded-xl px-4 py-2 text-sm font-bold text-sky-300">준비 중</div>

    <div class="glass rounded-xl px-3 py-2 flex items-center gap-2 pointer-events-auto">
      <button type="button" id="btn-guide-toggle" class="px-3 py-1.5 rounded-lg bg-sky-600/80 hover:bg-sky-500 text-xs font-bold text-white">조준선: ON (G)</button>
      <button type="button" id="btn-view-toggle" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200">시점: 3D (V)</button>
      <button type="button" id="btn-menu" class="px-3 py-1.5 rounded-lg bg-rose-600/80 hover:bg-rose-500 text-xs font-bold text-white">메뉴</button>
    </div>
  </div>

  <!-- 알림 토스트 -->
  <div id="toast-msg" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-20 glass px-5 py-2.5 rounded-full text-sm font-bold text-amber-200 shadow-xl pointer-events-none"></div>

  <!-- 좌측 하단 물리 텔레메트리 -->
  <div id="hud-telemetry" class="hidden fixed bottom-3 left-3 z-20 glass rounded-xl px-3.5 py-2.5 text-xs text-slate-300 space-y-1 pointer-events-none">
    <div>수구 속도: <span id="tel-speed" class="font-mono font-bold text-white">0.00 m/s</span></div>
    <div>회전 속도: <span id="tel-spin" class="font-mono font-bold text-sky-300">0.0 rad/s</span></div>
    <div>마찰 상태: <span id="tel-state" class="font-mono font-bold text-emerald-300">READY</span></div>
    <div id="tel-online" class="text-[11px] text-indigo-300 hidden">온라인: <span id="tel-peer-state">대기</span></div>
  </div>

  <!-- 우측 하단 당점 & 큐대 고각 조절 -->
  <div id="hud-controls" class="hidden fixed bottom-3 right-3 z-20 glass rounded-xl p-3 flex items-end gap-3 pointer-events-auto">
    <div class="flex flex-col items-center">
      <div class="text-[11px] font-bold text-slate-300 mb-1.5">큐대 고각: <span id="elev-label" class="text-sky-300">0°</span></div>
      <input id="elev-slider" type="range" min="0" max="75" value="0" class="vertical-slider" />
      <div class="text-[10px] text-slate-400 mt-1">▲/▼ 키</div>
    </div>

    <div class="flex flex-col items-center">
      <div class="text-[11px] font-bold text-slate-300 mb-1.5">당점 조절</div>
      <canvas id="tip-canvas" width="84" height="84" class="rounded-full bg-slate-900 border border-slate-600 cursor-crosshair"></canvas>
      <button type="button" id="btn-reset-tip" class="mt-1.5 text-[11px] px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300">중앙 초기화</button>
    </div>
  </div>

  <script>
    // --- 목표 점수 10 ~ 1000 (10점 단위) ---
    const targetSelect = document.getElementById('target-score-select');
    for (let s = 10; s <= 1000; s += 10) {
      const opt = document.createElement('option');
      opt.value = s;
      opt.textContent = s === 100 ? '100점 (표준)' : `${s}점`;
      if (s === 100) opt.selected = true;
      targetSelect.appendChild(opt);
    }

    // --- 게임 상태 ---
    const state = {
      gameMode: '3cushion', // '3cushion' | '4ball'
      playMode: 'practice',  // 'practice' | 'local' | 'online'
      targetScore: 100,
      scores: [0, 0],
      inning: 1,
      activePlayer: 0, // 0: 1P(흰공), 1: 2P(노란공)
      waitingForOpponent: false,
      isHost: false,
      myRole: 0, // 0 or 1 in online
      resetToken: 0,
      showGuide: true,
      topView: false,
      aimAngle: 0,
      aimPower: 0,
      isPulling: false,
      pullStart: { x: 0, y: 0 },
      tip: { x: 0, y: 0 }, // -0.75 ~ +0.75
      elevationDeg: 0,
      phase: 'aiming', // 'aiming' | 'moving' | 'gameover'
      shotStats: {
        cushions: 0,
        hitRed1: false,
        hitRed2: false,
        hitOpponentCue: false,
        hitOrder: []
      }
    };

    // --- PeerJS 온라인 통신 관리 ---
    const net = {
      peer: null,
      conn: null,
      roomCode: '',
      connected: false,
      reset() {
        if (this.conn) { try { this.conn.close(); } catch (e) {} this.conn = null; }
        if (this.peer) { try { this.peer.destroy(); } catch (e) {} this.peer = null; }
        this.roomCode = '';
        this.connected = false;
        updateNetStatus('방 만들기를 누르거나 상대 방 코드를 입력해 연결하세요.');
      },
      createRoom() {
        this.reset();
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let code = '';
        for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
        this.roomCode = code;
        state.isHost = true;
        state.myRole = 0;
        state.waitingForOpponent = true;
        updateNetStatus(`방 코드 [${code}] 생성 중...`);

        this.peer = new Peer('BM3D-' + code);
        this.peer.on('open', () => {
          document.getElementById('room-code-box').classList.remove('hidden');
          document.getElementById('room-code-box').classList.add('flex');
          document.getElementById('room-code-display').textContent = code;
          updateNetStatus(`방 [${code}] 생성 완료! 상대방 입장을 기다리는 중 (지금은 연습 샷 가능)`);
        });
        this.peer.on('connection', (connection) => {
          this.conn = connection;
          this.setupConn();
        });
        this.peer.on('error', (err) => {
          updateNetStatus('연결 오류: ' + (err.type || err.message));
        });
      },
      joinRoom(codeInput) {
        const code = (codeInput || '').trim().toUpperCase();
        if (!code) { updateNetStatus('방 코드를 입력해 주세요.'); return; }
        this.reset();
        this.roomCode = code;
        state.isHost = false;
        state.myRole = 1;
        state.waitingForOpponent = true;
        updateNetStatus(`방 [${code}]에 접속 중...`);

        this.peer = new Peer();
        this.peer.on('open', () => {
          this.conn = this.peer.connect('BM3D-' + code, { reliable: true });
          this.setupConn();
        });
        this.peer.on('error', (err) => {
          updateNetStatus('접속 실패: 방 코드를 확인해 주세요 (' + (err.type || '') + ')');
        });
      },
      setupConn() {
        this.conn.on('open', () => {
          this.connected = true;
          state.waitingForOpponent = false;
          updateNetStatus('상대방과 연결되었습니다!');
          if (state.isHost) {
            state.resetToken += 1;
            const initPayload = {
              type: 'match_init',
              resetToken: state.resetToken,
              gameMode: state.gameMode,
              targetScore: state.targetScore,
              balls: serializeBalls()
            };
            this.send(initPayload);
            startMatchFromHost(initPayload);
          }
          closeStartModalAndEnterGame();
        });
        this.conn.on('data', (msg) => handleNetMessage(msg));
        this.conn.on('close', () => {
          this.connected = false;
          showToast('상대방 연결이 종료되었습니다.');
          updateTurnBanner();
        });
      },
      send(data) {
        if (this.conn && this.conn.open) {
          this.conn.send(data);
        }
      }
    };

    function updateNetStatus(text) {
      const el = document.getElementById('net-status');
      if (el) el.textContent = text;
      const peerEl = document.getElementById('tel-peer-state');
      if (peerEl) peerEl.textContent = net.connected ? `연결됨 (${state.myRole === 0 ? '1P 흰공' : '2P 노란공'})` : (state.waitingForOpponent ? '상대 대기중' : '오프라인');
    }

    // --- Web Audio 효과음 ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playHitSound(intensity = 0.6, isCushion = false) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = isCushion ? 'sine' : 'triangle';
        const baseFreq = isCushion ? 210 : 760;
        osc.frequency.setValueAtTime(baseFreq + intensity * 300, now);
        osc.frequency.exponentialRampToValueAtTime(isCushion ? 65 : 140, now + 0.055);
        gain.gain.setValueAtTime(Math.min(0.35, intensity * 0.3), now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      } catch (e) {}
    }

    // --- Three.js 3D 씬 구성 ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b14);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 4.2, 4.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.75);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.05);
    dirLight.position.set(1.5, 6.5, 2.0);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(1024, 1024);
    scene.add(dirLight);

    // 당구대 규격 (미터 단위 스케일: 가로 2.84m, 세로 1.42m)
    const TABLE_W = 2.84;
    const TABLE_H = 1.42;
    const HALF_W = TABLE_W / 2;
    const HALF_H = TABLE_H / 2;
    const BALL_R = 0.032;
    const CUSHION_THICK = 0.08;
    const CUSHION_HEIGHT = 0.042;

    function createNavyClothTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 256;
      const ctx = c.getContext('2d');
      const grad = ctx.createRadialGradient(256, 128, 30, 256, 128, 320);
      grad.addColorStop(0, '#123163');
      grad.addColorStop(0.6, '#0d2142');
      grad.addColorStop(1, '#081630');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 256);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 600; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 256;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + (Math.random() - 0.5) * 8, y + (Math.random() - 0.5) * 8);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    const tableGroup = new THREE.Group();
    const bedGeo = new THREE.BoxGeometry(TABLE_W + 0.16, 0.1, TABLE_H + 0.16);
    const bedMat = new THREE.MeshStandardMaterial({ map: createNavyClothTexture(), roughness: 0.72, metalness: 0.05 });
    const bedMesh = new THREE.Mesh(bedGeo, bedMat);
    bedMesh.position.y = -0.05;
    bedMesh.receiveShadow = true;
    tableGroup.add(bedMesh);

    const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.45, metalness: 0.3 });
    const railLongGeo = new THREE.BoxGeometry(TABLE_W + 0.34, 0.12, 0.09);
    const railShortGeo = new THREE.BoxGeometry(0.09, 0.12, TABLE_H + 0.16);
    const rNorth = new THREE.Mesh(railLongGeo, frameMat); rNorth.position.set(0, -0.01, -HALF_H - 0.12);
    const rSouth = new THREE.Mesh(railLongGeo, frameMat); rSouth.position.set(0, -0.01, HALF_H + 0.12);
    const rWest = new THREE.Mesh(railShortGeo, frameMat); rWest.position.set(-HALF_W - 0.12, -0.01, 0);
    const rEast = new THREE.Mesh(railShortGeo, frameMat); rEast.position.set(HALF_W + 0.12, -0.01, 0);
    [rNorth, rSouth, rWest, rEast].forEach(m => { m.castShadow = true; m.receiveShadow = true; tableGroup.add(m); });

    const cushionMat = new THREE.MeshStandardMaterial({ color: 0x0d2142, roughness: 0.65 });
    const cNorth = new THREE.Mesh(new THREE.BoxGeometry(TABLE_W, CUSHION_HEIGHT, CUSHION_THICK), cushionMat);
    cNorth.position.set(0, CUSHION_HEIGHT / 2, -HALF_H - CUSHION_THICK / 2);
    const cSouth = new THREE.Mesh(new THREE.BoxGeometry(TABLE_W, CUSHION_HEIGHT, CUSHION_THICK), cushionMat);
    cSouth.position.set(0, CUSHION_HEIGHT / 2, HALF_H + CUSHION_THICK / 2);
    const cWest = new THREE.Mesh(new THREE.BoxGeometry(CUSHION_THICK, CUSHION_HEIGHT, TABLE_H), cushionMat);
    cWest.position.set(-HALF_W - CUSHION_THICK / 2, CUSHION_HEIGHT / 2, 0);
    const cEast = new THREE.Mesh(new THREE.BoxGeometry(CUSHION_THICK, CUSHION_HEIGHT, TABLE_H), cushionMat);
    cEast.position.set(HALF_W + CUSHION_THICK / 2, CUSHION_HEIGHT / 2, 0);
    [cNorth, cSouth, cWest, cEast].forEach(c => { c.castShadow = true; c.receiveShadow = true; tableGroup.add(c); });
    scene.add(tableGroup);

    // --- 공 4개 생성 (0: 흰공, 1: 노란공, 2: 빨간공1, 3: 빨간공2) ---
    function createBallMesh(colorHex, dotHex) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = colorHex;
      ctx.fillRect(0, 0, 256, 256);
      ctx.fillStyle = dotHex;
      ctx.beginPath(); ctx.arc(128, 64, 14, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(128, 192, 14, 0, Math.PI * 2); ctx.fill();
      const tex = new THREE.CanvasTexture(c);
      const geo = new THREE.SphereGeometry(BALL_R, 32, 32);
      const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.22, metalness: 0.08 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const balls = [
      { id: 'white', name: '흰공', mesh: createBallMesh('#f8fafc', '#94a3b8'), pos: new THREE.Vector3(-0.7, BALL_R, 0.15), vel: new THREE.Vector3(), omega: new THREE.Vector3(), active: true },
      { id: 'yellow', name: '노란공', mesh: createBallMesh('#facc15', '#ca8a04'), pos: new THREE.Vector3(-0.7, BALL_R, -0.15), vel: new THREE.Vector3(), omega: new THREE.Vector3(), active: true },
      { id: 'red1', name: '빨간공', mesh: createBallMesh('#ef4444', '#991b1b'), pos: new THREE.Vector3(0.55, BALL_R, 0), vel: new THREE.Vector3(), omega: new THREE.Vector3(), active: true },
      { id: 'red2', name: '빨간공2', mesh: createBallMesh('#dc2626', '#7f1d1d'), pos: new THREE.Vector3(0.85, BALL_R, 0.22), vel: new THREE.Vector3(), omega: new THREE.Vector3(), active: true }
    ];
    balls.forEach(b => scene.add(b.mesh));

    function applyBallLayout(mode) {
      balls.forEach(b => {
        b.vel.set(0, 0, 0);
        b.omega.set(0, 0, 0);
        b.pos.y = BALL_R;
        b.active = true;
        b.mesh.visible = true;
      });
      balls[0].pos.set(-0.72, BALL_R, 0.14);
      balls[1].pos.set(-0.72, BALL_R, -0.14);
      balls[2].pos.set(0.55, BALL_R, 0.0);
      if (mode === '4ball') {
        balls[3].pos.set(0.82, BALL_R, 0.24);
      } else {
        balls[3].active = false;
        balls[3].mesh.visible = false;
        balls[3].pos.set(0, -10, 0);
      }
      syncBallMeshes();
    }

    function syncBallMeshes() {
      balls.forEach(b => {
        if (!b.active) return;
        b.mesh.position.copy(b.pos);
        const speed = b.omega.length();
        if (speed > 0.0001) {
          const axis = b.omega.clone().normalize();
          const q = new THREE.Quaternion().setFromAxisAngle(axis, speed * (1 / 120));
          b.mesh.quaternion.premultiply(q).normalize();
        }
      });
    }

    function serializeBalls() {
      return balls.map(b => ({
        x: b.pos.x, y: b.pos.y, z: b.pos.z,
        vx: b.vel.x, vy: b.vel.y, vz: b.vel.z,
        wx: b.omega.x, wy: b.omega.y, wz: b.omega.z,
        active: b.active
      }));
    }

    function applySerializedBalls(arr) {
      if (!Array.isArray(arr)) return;
      arr.forEach((d, idx) => {
        const b = balls[idx];
        if (!b || !d) return;
        b.pos.set(d.x, d.y, d.z);
        b.vel.set(d.vx, d.vy, d.vz);
        b.omega.set(d.wx, d.wy, d.wz);
        b.active = !!d.active;
        b.mesh.visible = b.active;
      });
      syncBallMeshes();
    }

    // --- 3D 큐대 & 조준 가이드라인 ---
    const cuePivot = new THREE.Group();
    const cueElevPivot = new THREE.Group();
    const cueShaft = new THREE.Mesh(
      new THREE.CylinderGeometry(0.007, 0.013, 1.35, 16),
      new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.35 })
    );
    cueShaft.rotation.x = Math.PI / 2;
    cueShaft.position.z = 0.74;
    cueShaft.castShadow = true;
    cueElevPivot.add(cueShaft);
    cuePivot.add(cueElevPivot);
    scene.add(cuePivot);

    const guideGroup = new THREE.Group();
    const mainLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
    const mainLine = new THREE.Line(mainLineGeo, new THREE.LineBasicMaterial({ color: 0x38bdf8 }));
    const splitLineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
    const splitLine = new THREE.Line(splitLineGeo, new THREE.LineDashedMaterial({ color: 0xfbbf24, dashSize: 0.05, gapSize: 0.03 }));
    const hitMarker = new THREE.Mesh(
      new THREE.RingGeometry(0.022, 0.034, 24),
      new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide })
    );
    hitMarker.rotation.x = -Math.PI / 2;
    hitMarker.position.y = 0.003;
    guideGroup.add(mainLine, splitLine, hitMarker);
    scene.add(guideGroup);

    function getCueBall() {
      if (state.playMode === 'practice' || state.waitingForOpponent) return balls[0];
      return state.activePlayer === 0 ? balls[0] : balls[1];
    }

    function canControlCue() {
      if (state.phase !== 'aiming') return false;
      if (state.playMode === 'practice' || state.waitingForOpponent) return true;
      if (state.playMode === 'local') return true;
      if (state.playMode === 'online') return net.connected && state.activePlayer === state.myRole;
      return false;
    }

    function updateCueAndGuides() {
      const cueBall = getCueBall();
      const showCue = canControlCue();
      cuePivot.visible = showCue;
      guideGroup.visible = showCue && state.showGuide;

      if (!showCue || !cueBall || !cueBall.active) return;

      const pullOffset = 0.08 + state.aimPower * 0.28;
      cuePivot.position.set(cueBall.pos.x, cueBall.pos.y, cueBall.pos.z);
      cuePivot.rotation.y = state.aimAngle;
      const elevRad = THREE.MathUtils.degToRad(state.elevationDeg);
      cueElevPivot.rotation.x = -elevRad;
      cueElevPivot.position.set(0, 0, pullOffset);

      // 조준선 계산
      const dirX = Math.sin(state.aimAngle);
      const dirZ = Math.cos(state.aimAngle);
      const start = new THREE.Vector3(cueBall.pos.x, 0.005, cueBall.pos.z);
      let end = new THREE.Vector3(start.x + dirX * 1.4, 0.005, start.z + dirZ * 1.4);
      let hitTarget = null;

      // 벽 충돌 검사
      if (end.x > HALF_W - BALL_R) {
        const t = (HALF_W - BALL_R - start.x) / (dirX || 0.0001);
        if (t > 0) end = new THREE.Vector3(HALF_W - BALL_R, 0.005, start.z + dirZ * t);
      } else if (end.x < -HALF_W + BALL_R) {
        const t = (-HALF_W + BALL_R - start.x) / (dirX || -0.0001);
        if (t > 0) end = new THREE.Vector3(-HALF_W + BALL_R, 0.005, start.z + dirZ * t);
      }
      if (end.z > HALF_H - BALL_R) {
        const t = (HALF_H - BALL_R - start.z) / (dirZ || 0.0001);
        if (t > 0 && start.x + dirX * t <= end.x) end = new THREE.Vector3(start.x + dirX * t, 0.005, HALF_H - BALL_R);
      } else if (end.z < -HALF_H + BALL_R) {
        const t = (-HALF_H + BALL_R - start.z) / (dirZ || -0.0001);
        if (t > 0 && start.x + dirX * t <= end.x) end = new THREE.Vector3(start.x + dirX * t, 0.005, -HALF_H + BALL_R);
      }

      // 공 충돌 예측
      let bestDist = start.distanceTo(end);
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];
        if (!b.active || b === cueBall) continue;
        const toB = new THREE.Vector3(b.pos.x - start.x, 0, b.pos.z - start.z);
        const dirV = new THREE.Vector3(dirX, 0, dirZ);
        const proj = toB.dot(dirV);
        if (proj <= 0) continue;
        const perpSq = toB.lengthSq() - proj * proj;
        const minDist = BALL_R * 2;
        if (perpSq < minDist * minDist) {
          const distToHit = proj - Math.sqrt(Math.max(0, minDist * minDist - perpSq));
          if (distToHit > 0 && distToHit < bestDist) {
            bestDist = distToHit;
            end = new THREE.Vector3(start.x + dirX * distToHit, 0.005, start.z + dirZ * distToHit);
            hitTarget = b;
          }
        }
      }

      mainLine.geometry.setFromPoints([start, end]);
      if (hitTarget) {
        hitMarker.visible = true;
        hitMarker.position.set(end.x, 0.004, end.z);
        splitLine.visible = true;
        const n = new THREE.Vector3(hitTarget.pos.x - end.x, 0, hitTarget.pos.z - end.z).normalize();
        const splitEnd = new THREE.Vector3(end.x + n.x * 0.45, 0.005, end.z + n.z * 0.45);
        splitLine.geometry.setFromPoints([end, splitEnd]);
        splitLine.computeLineDistances();
      } else {
        hitMarker.visible = false;
        splitLine.visible = false;
      }
    }

    // --- 샷 발사 및 3D 물리 적분 ---
    function executeShot(angle, power, tipX, tipY, elevDeg, fromRemote = false) {
      const cueBall = getCueBall();
      if (!cueBall || !cueBall.active) return;

      const clampedPower = Math.max(0.08, Math.min(1.0, power));
      const elevRad = THREE.MathUtils.degToRad(elevDeg);
      const speed = clampedPower * 5.8;

      // 스쿼트(회전 시 미세 편향)
      const squatShift = -tipX * clampedPower * 0.035;
      const finalAngle = angle + squatShift;
      const dirX = Math.sin(finalAngle);
      const dirZ = Math.cos(finalAngle);

      const horizSpeed = speed * Math.cos(elevRad);
      const vertSpeed = speed * Math.sin(elevRad) * 0.65;

      cueBall.vel.set(dirX * horizSpeed, vertSpeed, dirZ * horizSpeed);
      // 당점 스핀 설정: tipY > 0 상단(전진), tipY < 0 하단(후진), tipX 좌우 회전
      const rightX = Math.cos(finalAngle);
      const rightZ = -Math.sin(finalAngle);
      cueBall.omega.set(
        rightX * (-tipY) * clampedPower * 28,
        tipX * clampedPower * 24,
        rightZ * (-tipY) * clampedPower * 28
      );

      state.shotStats = {
        cushions: 0,
        hitRed1: false,
        hitRed2: false,
        hitOpponentCue: false,
        hitOrder: []
      };
      state.phase = 'moving';
      state.aimPower = 0;

      playHitSound(clampedPower, false);

      if (!fromRemote && state.playMode === 'online' && net.connected) {
        net.send({
          type: 'shot',
          angle,
          power: clampedPower,
          tipX,
          tipY,
          elevDeg
        });
      }
    }

    function stepPhysics(dt) {
      const subSteps = 4;
      const h = dt / subSteps;
      const gravity = 9.81;
      const muSlide = 0.20;
      const muRoll = 0.014;
      const cushionRest = 0.78;
      const ballRest = 0.94;

      for (let step = 0; step < subSteps; step++) {
        for (let i = 0; i < balls.length; i++) {
          const b = balls[i];
          if (!b.active) continue;

          // 수직 이동
          if (b.pos.y > BALL_R || b.vel.y > 0) {
            b.vel.y -= gravity * h;
            b.pos.y += b.vel.y * h;
            if (b.pos.y <= BALL_R) {
              b.pos.y = BALL_R;
              if (b.vel.y < -0.25) {
                b.vel.y = -b.vel.y * 0.45;
              } else {
                b.vel.y = 0;
              }
            }
          }

          // 수평 이동
          b.pos.x += b.vel.x * h;
          b.pos.z += b.vel.z * h;

          // 지면 접촉 시 마찰 및 미끄럼->구름 전이
          if (b.pos.y <= BALL_R + 0.0005) {
            const horizSpeed = Math.hypot(b.vel.x, b.vel.z);
            if (horizSpeed > 0.001) {
              const nx = b.vel.x / horizSpeed;
              const nz = b.vel.z / horizSpeed;
              // 구름 회전 속도 근사치
              const rollOmegaMag = horizSpeed / BALL_R;
              const currentRollMag = Math.hypot(b.omega.x, b.omega.z);
              const isSliding = Math.abs(currentRollMag - rollOmegaMag) > 2.2;

              // 마세(수직 회전축 omega.y가 있을 때 궤적 휨)
              if (Math.abs(b.omega.y) > 0.5) {
                const curveFactor = b.omega.y * 0.018 * h;
                const perpX = -nz;
                const perpZ = nx;
                b.vel.x += perpX * curveFactor * horizSpeed;
                b.vel.z += perpZ * curveFactor * horizSpeed;
              }

              const mu = isSliding ? muSlide : muRoll;
              const decel = mu * gravity * h;
              const nextSpeed = Math.max(0, horizSpeed - decel);
              if (nextSpeed < 0.012) {
                b.vel.x = 0;
                b.vel.z = 0;
              } else {
                const ratio = nextSpeed / horizSpeed;
                b.vel.x *= ratio;
                b.vel.z *= ratio;
              }

              // 회전 감쇠 및 동기화
              b.omega.x *= Math.pow(0.92, h * 60);
              b.omega.y *= Math.pow(0.95, h * 60);
              b.omega.z *= Math.pow(0.92, h * 60);
            } else {
              b.vel.x = 0;
              b.vel.z = 0;
              b.omega.multiplyScalar(Math.pow(0.90, h * 60));
            }
          }

          // 쿠션 충돌
          let hitCushion = false;
          const minX = -HALF_W + BALL_R;
          const maxX = HALF_W - BALL_R;
          const minZ = -HALF_H + BALL_R;
          const maxZ = HALF_H - BALL_R;

          if (b.pos.x < minX) {
            b.pos.x = minX;
            if (b.vel.x < 0) {
              b.vel.x = -b.vel.x * cushionRest;
              b.vel.z += b.omega.y * 0.0022;
              hitCushion = true;
            }
          } else if (b.pos.x > maxX) {
            b.pos.x = maxX;
            if (b.vel.x > 0) {
              b.vel.x = -b.vel.x * cushionRest;
              b.vel.z -= b.omega.y * 0.0022;
              hitCushion = true;
            }
          }

          if (b.pos.z < minZ) {
            b.pos.z = minZ;
            if (b.vel.z < 0) {
              b.vel.z = -b.vel.z * cushionRest;
              b.vel.x -= b.omega.y * 0.0022;
              hitCushion = true;
            }
          } else if (b.pos.z > maxZ) {
            b.pos.z = maxZ;
            if (b.vel.z > 0) {
              b.vel.z = -b.vel.z * cushionRest;
              b.vel.x += b.omega.y * 0.0022;
              hitCushion = true;
            }
          }

          if (hitCushion) {
            const impact = Math.abs(b.vel.x) + Math.abs(b.vel.z);
            if (impact > 0.25) playHitSound(Math.min(1, impact / 4), true);
            if (state.phase === 'moving' && b === getCueBall()) {
              state.shotStats.cushions += 1;
            }
          }
        }

        // 공 간 충돌
        for (let i = 0; i < balls.length; i++) {
          for (let j = i + 1; j < balls.length; j++) {
            const a = balls[i];
            const c = balls[j];
            if (!a.active || !c.active) continue;
            const dx = c.pos.x - a.pos.x;
            const dy = c.pos.y - a.pos.y;
            const dz = c.pos.z - a.pos.z;
            const distSq = dx * dx + dy * dy + dz * dz;
            const minDist = BALL_R * 2;
            if (distSq > 0 && distSq < minDist * minDist) {
              const dist = Math.sqrt(distSq);
              const nx = dx / dist;
              const ny = dy / dist;
              const nz = dz / dist;
              const overlap = (minDist - dist) * 0.5;
              a.pos.x -= nx * overlap; a.pos.y -= ny * overlap; a.pos.z -= nz * overlap;
              c.pos.x += nx * overlap; c.pos.y += ny * overlap; c.pos.z += nz * overlap;

              const rvx = c.vel.x - a.vel.x;
              const rvy = c.vel.y - a.vel.y;
              const rvz = c.vel.z - a.vel.z;
              const velAlongNormal = rvx * nx + rvy * ny + rvz * nz;
              if (velAlongNormal < 0) {
                const impulse = (-(1 + ballRest) * velAlongNormal) * 0.5;
                a.vel.x -= impulse * nx; a.vel.y -= impulse * ny; a.vel.z -= impulse * nz;
                c.vel.x += impulse * nx; c.vel.y += impulse * ny; c.vel.z += impulse * nz;

                // 스로우(회전에 의한 측면 편향)
                const tx = -nz;
                const tz = nx;
                const throwMag = a.omega.y * 0.0015;
                c.vel.x += tx * throwMag;
                c.vel.z += tz * throwMag;

                const relMag = Math.abs(velAlongNormal);
                if (relMag > 0.2) playHitSound(Math.min(1, relMag / 4.5), false);

                recordBallHit(a, c);
              }
            }
          }
        }
      }

      syncBallMeshes();
      updateTelemetry();

      if (state.phase === 'moving' && areAllBallsStopped()) {
        evaluateTurnResult();
      }
    }

    function recordBallHit(a, c) {
      const cue = getCueBall();
      let other = null;
      if (a === cue) other = c;
      else if (c === cue) other = a;
      if (!other) return;

      if (!state.shotStats.hitOrder.includes(other.id)) {
        state.shotStats.hitOrder.push(other.id);
      }
      if (other.id === 'red1') state.shotStats.hitRed1 = true;
      if (other.id === 'red2') state.shotStats.hitRed2 = true;
      if (state.gameMode === '4ball' && cue.id === 'white' && other.id === 'yellow') {
        state.shotStats.hitOpponentCue = true;
      }
    }

    function areAllBallsStopped() {
      return balls.every(b => {
        if (!b.active) return true;
        return b.vel.length() < 0.015 && b.pos.y <= BALL_R + 0.001;
      });
    }

    function evaluateTurnResult() {
      // 대기 중 연습 모드면 점수/턴 변동 없이 바로 조준 복귀
      if (state.playMode === 'practice' || state.waitingForOpponent) {
        state.phase = 'aiming';
        updateTurnBanner();
        return;
      }

      const st = state.shotStats;
      let delta = 0;
      let scored = false;
      let msg = '';

      if (state.gameMode === '3cushion') {
        const hitTwoObj = st.hitOrder.length >= 2;
        if (hitTwoObj && st.cushions >= 3) {
          scored = true;
          delta = 10;
          msg = `3쿠션 득점! +10점 (쿠션 ${st.cushions}회)`;
        } else {
          msg = `미득점 (적구 ${st.hitOrder.length}개 접촉, 쿠션 ${st.cushions}회)`;
        }
      } else {
        // 4구
        if (st.hitOpponentCue) {
          delta = -10;
          msg = '상대 수구 접촉 파울! -10점';
        } else if (st.hitRed1 && st.hitRed2) {
          scored = true;
          delta = 10;
          msg = '4구 득점! +10점';
        } else {
          msg = '미득점';
        }
      }

      const pIdx = state.activePlayer;
      state.scores[pIdx] = Math.max(0, state.scores[pIdx] + delta);
      updateScoreHUD();
      showToast(msg);

      if (state.scores[pIdx] >= state.targetScore) {
        state.phase = 'gameover';
        updateTurnBanner(`${pIdx === 0 ? '1P (흰공)' : '2P (노란공)'} 승리! (${state.scores[pIdx]}점)`);
        return;
      }

      if (!scored) {
        state.activePlayer = state.activePlayer === 0 ? 1 : 0;
        if (state.activePlayer === 0) state.inning += 1;
      }

      state.phase = 'aiming';
      updateTurnBanner();

      // 온라인 호스트가 샷 종료 후 상태 동기화
      if (state.playMode === 'online' && net.connected && state.isHost) {
        net.send({
          type: 'turn_sync',
          scores: [...state.scores],
          inning: state.inning,
          activePlayer: state.activePlayer,
          phase: state.phase,
          balls: serializeBalls()
        });
      }
    }

    function handleNetMessage(msg) {
      if (!msg || !msg.type) return;
      if (msg.type === 'match_init') {
        state.resetToken = msg.resetToken;
        state.gameMode = msg.gameMode;
        state.targetScore = msg.targetScore;
        state.scores = [0, 0];
        state.inning = 1;
        state.activePlayer = 0;
        state.phase = 'aiming';
        applySerializedBalls(msg.balls);
        updateScoreHUD();
        updateTurnBanner();
        closeStartModalAndEnterGame();
        showToast('온라인 경기가 시작되었습니다!');
      } else if (msg.type === 'shot') {
        executeShot(msg.angle, msg.power, msg.tipX, msg.tipY, msg.elevDeg, true);
      } else if (msg.type === 'turn_sync') {
        state.scores = [...msg.scores];
        state.inning = msg.inning;
        state.activePlayer = msg.activePlayer;
        state.phase = msg.phase;
        applySerializedBalls(msg.balls);
        updateScoreHUD();
        updateTurnBanner();
      }
    }

    function startMatchFromHost(payload) {
      state.gameMode = payload.gameMode;
      state.targetScore = payload.targetScore;
      state.scores = [0, 0];
      state.inning = 1;
      state.activePlayer = 0;
      state.phase = 'aiming';
      applyBallLayout(state.gameMode);
      updateScoreHUD();
      updateTurnBanner();
    }

    // --- HUD & UI 제어 ---
    function updateScoreHUD() {
      document.getElementById('score-p1').textContent = state.scores[0];
      document.getElementById('score-p2').textContent = state.scores[1];
      document.getElementById('hud-target').textContent = state.targetScore;
      document.getElementById('hud-inning').textContent = state.inning;
    }

    function updateTurnBanner(customText) {
      const el = document.getElementById('turn-banner');
      if (customText) { el.textContent = customText; return; }
      if (state.playMode === 'practice') {
        el.textContent = '1인 연습 모드 (흰공)';
      } else if (state.playMode === 'online' && state.waitingForOpponent) {
        el.textContent = `상대방 대기 중 · 방 코드 [${net.roomCode}] (연습 가능)`;
      } else if (state.playMode === 'online') {
        const myTurn = state.activePlayer === state.myRole;
        el.textContent = myTurn
          ? `내 차례 (${state.myRole === 0 ? '1P 흰공' : '2P 노란공'}) - 조준 후 드래그`
          : `상대방 차례 (${state.activePlayer === 0 ? '1P 흰공' : '2P 노란공'}) 대기 중`;
      } else {
        el.textContent = `${state.activePlayer === 0 ? '1P (흰공)' : '2P (노란공)'} 차례`;
      }
    }

    let toastTimer = null;
    function showToast(text) {
      const el = document.getElementById('toast-msg');
      el.textContent = text;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 2400);
    }

    function updateTelemetry() {
      const cue = getCueBall();
      if (!cue) return;
      const sp = Math.hypot(cue.vel.x, cue.vel.z);
      const om = cue.omega.length();
      document.getElementById('tel-speed').textContent = `${sp.toFixed(2)} m/s`;
      document.getElementById('tel-spin').textContent = `${om.toFixed(1)} rad/s`;
      const stEl = document.getElementById('tel-state');
      if (cue.pos.y > BALL_R + 0.002) {
        stEl.textContent = 'AIRBORNE';
        stEl.className = 'font-mono font-bold text-amber-300';
      } else if (sp < 0.015) {
        stEl.textContent = 'STOPPED';
        stEl.className = 'font-mono font-bold text-slate-400';
      } else {
        const rollMag = Math.hypot(cue.omega.x, cue.omega.z);
        const sliding = Math.abs(rollMag - sp / BALL_R) > 2.2;
        stEl.textContent = sliding ? 'SLIDING' : 'ROLLING';
        stEl.className = sliding ? 'font-mono font-bold text-rose-300' : 'font-mono font-bold text-emerald-300';
      }
    }

    function closeStartModalAndEnterGame() {
      document.getElementById('start-modal').classList.add('hidden');
      ['hud-top', 'hud-telemetry', 'hud-controls'].forEach(id => document.getElementById(id).classList.remove('hidden'));
      document.getElementById('tel-online').classList.toggle('hidden', state.playMode !== 'online');
      updateScoreHUD();
      updateTurnBanner();
    }

    // --- 메뉴 이벤트 ---
    document.querySelectorAll('.game-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.game-mode-btn').forEach(b => {
          b.className = 'game-mode-btn text-left p-4 rounded-xl border border-slate-700 bg-slate-900/60 hover:border-slate-500 transition';
        });
        btn.className = 'game-mode-btn text-left p-4 rounded-xl border-2 border-blue-500 bg-blue-950/40 transition';
        state.gameMode = btn.dataset.game;
      });
    });

    document.querySelectorAll('.play-mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.play-mode-btn').forEach(b => {
          b.className = 'play-mode-btn text-left p-3.5 rounded-xl border border-slate-700 bg-slate-900/60 hover:border-slate-500 transition';
        });
        btn.className = 'play-mode-btn text-left p-3.5 rounded-xl border-2 border-emerald-500 bg-emerald-950/35 transition';
        state.playMode = btn.dataset.play;
        document.getElementById('online-panel').classList.toggle('hidden', state.playMode !== 'online');
      });
    });

    document.getElementById('btn-create-room').addEventListener('click', () => net.createRoom());
    document.getElementById('btn-join-room').addEventListener('click', () => net.joinRoom(document.getElementById('join-code-input').value));
    document.getElementById('btn-copy-code').addEventListener('click', () => {
      navigator.clipboard?.writeText(net.roomCode);
      showToast('방 코드가 복사되었습니다: ' + net.roomCode);
    });

    document.getElementById('btn-start-game').addEventListener('click', () => {
      state.targetScore = parseInt(targetSelect.value, 10) || 100;
      state.scores = [0, 0];
      state.inning = 1;
      state.activePlayer = 0;
      state.phase = 'aiming';
      applyBallLayout(state.gameMode);

      if (state.playMode === 'online' && !net.connected) {
        if (!net.peer) net.createRoom();
        state.waitingForOpponent = true;
      }
      closeStartModalAndEnterGame();
    });

    document.getElementById('btn-menu').addEventListener('click', () => {
      ['hud-top', 'hud-telemetry', 'hud-controls'].forEach(id => document.getElementById(id).classList.add('hidden'));
      document.getElementById('start-modal').classList.remove('hidden');
    });

    document.getElementById('btn-guide-toggle').addEventListener('click', () => {
      state.showGuide = !state.showGuide;
      document.getElementById('btn-guide-toggle').textContent = `조준선: ${state.showGuide ? 'ON' : 'OFF'} (G)`;
    });

    document.getElementById('btn-view-toggle').addEventListener('click', () => {
      state.topView = !state.topView;
      document.getElementById('btn-view-toggle').textContent = `시점: ${state.topView ? '탑뷰' : '3D'} (V)`;
    });

    // --- 당점 조절 캔버스 ---
    const tipCanvas = document.getElementById('tip-canvas');
    const tipCtx = tipCanvas.getContext('2d');
    let draggingTip = false;

    function drawTipCanvas() {
      const w = tipCanvas.width, h = tipCanvas.height, r = w / 2 - 6;
      tipCtx.clearRect(0, 0, w, h);
      tipCtx.fillStyle = '#f8fafc';
      tipCtx.beginPath(); tipCtx.arc(w / 2, h / 2, r, 0, Math.PI * 2); tipCtx.fill();
      tipCtx.strokeStyle = '#94a3b8'; tipCtx.lineWidth = 1;
      tipCtx.beginPath(); tipCtx.moveTo(w / 2, 6); tipCtx.lineTo(w / 2, h - 6); tipCtx.stroke();
      tipCtx.beginPath(); tipCtx.moveTo(6, h / 2); tipCtx.lineTo(w - 6, h / 2); tipCtx.stroke();

      const dx = w / 2 + (state.tip.x / 0.75) * (r - 6);
      const dy = h / 2 - (state.tip.y / 0.75) * (r - 6);
      tipCtx.fillStyle = '#ef4444';
      tipCtx.beginPath(); tipCtx.arc(dx, dy, 5, 0, Math.PI * 2); tipCtx.fill();
    }

    function setTipFromEvent(e) {
      const rect = tipCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      let nx = (x - 0.5) * 2;
      let ny = (0.5 - y) * 2;
      const len = Math.hypot(nx, ny);
      if (len > 1) { nx /= len; ny /= len; }
      state.tip.x = nx * 0.75;
      state.tip.y = ny * 0.75;
      drawTipCanvas();
    }

    tipCanvas.addEventListener('mousedown', (e) => { draggingTip = true; setTipFromEvent(e); });
    window.addEventListener('mousemove', (e) => { if (draggingTip) setTipFromEvent(e); });
    window.addEventListener('mouseup', () => { draggingTip = false; });
    document.getElementById('btn-reset-tip').addEventListener('click', () => {
      state.tip = { x: 0, y: 0 };
      drawTipCanvas();
    });
    drawTipCanvas();

    // --- 큐대 고각 슬라이더 & 키보드/마우스 조작 ---
    const elevSlider = document.getElementById('elev-slider');
    const elevLabel = document.getElementById('elev-label');
    elevSlider.addEventListener('input', () => {
      state.elevationDeg = parseInt(elevSlider.value, 10) || 0;
      elevLabel.textContent = `${state.elevationDeg}°`;
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'g' || e.key === 'G') {
        state.showGuide = !state.showGuide;
        document.getElementById('btn-guide-toggle').textContent = `조준선: ${state.showGuide ? 'ON' : 'OFF'} (G)`;
      } else if (e.key === 'v' || e.key === 'V') {
        state.topView = !state.topView;
        document.getElementById('btn-view-toggle').textContent = `시점: ${state.topView ? '탑뷰' : '3D'} (V)`;
      } else if (e.key === 'ArrowLeft') {
        state.aimAngle += 0.025;
      } else if (e.key === 'ArrowRight') {
        state.aimAngle -= 0.025;
      } else if (e.key === 'ArrowUp') {
        state.elevationDeg = Math.min(75, state.elevationDeg + 2);
        elevSlider.value = state.elevationDeg;
        elevLabel.textContent = `${state.elevationDeg}°`;
      } else if (e.key === 'ArrowDown') {
        state.elevationDeg = Math.max(0, state.elevationDeg - 2);
        elevSlider.value = state.elevationDeg;
        elevLabel.textContent = `${state.elevationDeg}°`;
      }
    });

    let orbitingCamera = false;
    let lastCamMouse = { x: 0, y: 0 };
    let camYaw = 0;
    let camPitch = 0.78;
    let camDist = 3.8;

    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
    renderer.domElement.addEventListener('mousedown', (e) => {
      if (e.button === 2) {
        orbitingCamera = true;
        lastCamMouse = { x: e.clientX, y: e.clientY };
      } else if (e.button === 0 && canControlCue()) {
        state.isPulling = true;
        state.pullStart = { x: e.clientX, y: e.clientY };
        state.aimPower = 0.1;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (orbitingCamera) {
        const dx = e.clientX - lastCamMouse.x;
        const dy = e.clientY - lastCamMouse.y;
        lastCamMouse = { x: e.clientX, y: e.clientY };
        camYaw -= dx * 0.006;
        camPitch = Math.max(0.22, Math.min(1.35, camPitch + dy * 0.006));
      } else if (state.isPulling) {
        const dist = Math.hypot(e.clientX - state.pullStart.x, e.clientY - state.pullStart.y);
        state.aimPower = Math.min(1.0, Math.max(0.08, dist / 180));
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 2) orbitingCamera = false;
      if (e.button === 0 && state.isPulling) {
        state.isPulling = false;
        if (canControlCue() && state.aimPower > 0.08) {
          executeShot(state.aimAngle, state.aimPower, state.tip.x, state.tip.y, state.elevationDeg, false);
        } else {
          state.aimPower = 0;
        }
      }
    });

    renderer.domElement.addEventListener('wheel', (e) => {
      camDist = Math.max(1.8, Math.min(7.5, camDist + e.deltaY * 0.002));
    }, { passive: true });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 메인 루프 ---
    let lastTime = performance.now();
    function animate(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;

      stepPhysics(dt);
      updateCueAndGuides();

      const cue = getCueBall();
      const focus = cue && cue.active ? cue.pos : new THREE.Vector3(0, 0, 0);
      if (state.topView) {
        camera.position.lerp(new THREE.Vector3(0, 4.6, 0.01), 0.12);
        camera.lookAt(0, 0, 0);
      } else {
        const desiredPos = new THREE.Vector3(
          focus.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist,
          Math.max(0.7, Math.sin(camPitch) * camDist),
          focus.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist
        );
        camera.position.lerp(desiredPos, 0.12);
        camera.lookAt(focus.x * 0.4, 0, focus.z * 0.4);
      }

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    applyBallLayout(state.gameMode);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
